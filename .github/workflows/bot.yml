name: crossout-bot

on:
  schedule:
    - cron: '*/20 * * * *'   # каждые 20 минут (GitHub может задерживать запуск на несколько минут)
  workflow_dispatch:         # ручной запуск кнопкой во вкладке Actions

concurrency:
  group: crossout-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка sharp (конвертация иконок)
        run: npm i sharp --no-save --no-audit --no-fund

      # state.json (дедупликация) и names.json (кэш названий) живут между запусками в кэше Actions
      - name: Восстановить состояние
        uses: actions/cache@v4
        with:
          path: |
            state.json
            names.json
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      - name: Запуск бота
        run: node bot.js --once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MIN_PROFIT: '35'
          MIN_ROI: '0'
          MIN_BUY_ORDERS: '0'
          REALERT_HOURS: '3'
          MAX_PER_MESSAGE: '10'
          REF_FIELD: s
          REF_MODE: max
          REF_POINTS: '6'
          REF_SKIP_LAST: '0'
          FEE: '0.9'
