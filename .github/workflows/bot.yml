name: crossout-bot

on:
  schedule:
    - cron: '7 * * * *'      # запасной запуск раз в час (основной запуск — cron-job.org)
  workflow_dispatch:         # ручной запуск и запуск из cron-job.org

concurrency:
  group: crossout-bot
  cancel-in-progress: false

permissions:
  contents: write            # нужно, чтобы дописывать журнал в ветку data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Установка sharp (конвертация иконок)
        run: npm i sharp --no-save --no-audit --no-fund

      # state.json (дедупликация), names.json (названия) и icons (иконки) живут между запусками в кэше Actions
      - name: Восстановить состояние
        uses: actions/cache@v4
        with:
          path: |
            state.json
            names.json
            icons
          key: bot-state-${{ github.run_id }}
          restore-keys: |
            bot-state-

      # журнал сигналов и результатов хранится в отдельной ветке data (папка data/)
      - name: Подключить журнал (ветка data)
        run: |
          URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$URL" data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "$URL" data
          else
            mkdir data && cd data && git init -q -b data && git remote add origin "$URL"
          fi

      - name: Запуск бота
        run: node bot.js --once
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          JOURNAL_DIR: data
          MIN_PROFIT: '25'
          SHADOW_MIN_PROFIT: '10'
          CAPITAL_BUDGET: '3500'  # замени на приблизительный игровой баланс
          REPORT_HOUR_LOCAL: '10'
          MIN_ROI: '0'
          MIN_BUY_ORDERS: '0'
          REALERT_HOURS: '1'
          CARDS_PER_RUN: '5'
          REF_FIELD: s
          REF_MODE: max
          REF_POINTS: '6'
          REF_SKIP_LAST: '0'
          FEE: '0.9'

      - name: Сохранить журнал
        if: always()
        run: |
          cd data
          git config user.name "crossout-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "journal $(date -u +%FT%TZ)"
            git push -q origin HEAD:data
          fi
